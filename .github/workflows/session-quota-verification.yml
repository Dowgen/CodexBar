name: Verify Codex review follow-up

on:
  push:
    branches: [verify/codex-session-quota-20261115]

permissions:
  contents: read

concurrency:
  group: codex-session-quota-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'Dowgen/CodexBar'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out the exact upstream PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 274b3ea9dc95136f2fbcbd071d05aa9d1311795c
          persist-credentials: false

      - name: Select the repository-supported Xcode toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          evidence_dir="$RUNNER_TEMP/codex-session-quota-evidence"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "CODEXBAR_SESSION_QUOTA_PROOF_DIR=$evidence_dir" >> "$GITHUB_ENV"
          mkdir -p "$evidence_dir"
          {
            git rev-parse HEAD
            xcodebuild -version
            swift --version
          } | tee "$evidence_dir/environment.log"

      - name: Identify the exact SwiftPM cache context
        id: build-context
        run: python3 Scripts/ci_swiftpm_cache.py context --lane xcode27-arm64

      - name: Restore verified incremental build inputs
        id: compiled-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: quota-${{ steps.build-context.outputs.prefix }}274b3ea9dc95136f2fbcbd071d05aa9d1311795c
          restore-keys: |
            quota-${{ steps.build-context.outputs.prefix }}

      - name: Verify cached inputs with a clean fallback
        env:
          BUILD_CONTEXT: ${{ steps.build-context.outputs.context }}
          COMPILED_CACHE_KEY: ${{ steps.compiled-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [[ -z "$COMPILED_CACHE_KEY" ]]; then
            rm -f .build/ci-inputs.json
          fi
          python3 Scripts/ci_swiftpm_cache.py restore --context "$BUILD_CONTEXT" --clean-fallback
          python3 Scripts/ci_swiftpm_cache.py snapshot --context "$BUILD_CONTEXT"

      - name: Reproduce the stale regression from the verified cached build
        id: before
        env:
          CODEXBAR_TEST_NATIVE_TIMEOUT: 300
          CACHED_BUILD_KEY: ${{ steps.compiled-cache.outputs.cache-matched-key }}
        run: |
          set -uo pipefail
          set +e
          test -n "$CACHED_BUILD_KEY" || exit 1
          source Scripts/test_environment.sh
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/before-regression.log"
          import os, pathlib, sys, tempfile
          sys.path.insert(0, "Scripts")
          from ci_swift_test_by_suite import run_command
          home = tempfile.mkdtemp(prefix="codex-quota-before-home-", dir=os.environ["RUNNER_TEMP"])
          # Keep this isolated HOME for the lifetime of the ephemeral job: Apple's Metal
          # toolchain may mount a read-only volume there, which TemporaryDirectory cannot unlink.
          environment = os.environ | {"HOME": home, "CFFIXED_USER_HOME": home}
          result = run_command(["swift", "test", "--no-parallel", "--skip-build", "--jobs", "2",
              "--filter", "CodexWeeklyCapSurfaceTests"], timeout=300, environment=environment)
          pathlib.Path(os.environ["EVIDENCE_DIR"], "before-home.txt").write_text(home)
          sys.exit(result)
          PY
          result=${PIPESTATUS[0]}
          echo "$result" > "$EVIDENCE_DIR/before-exit-code.txt"
          test "$result" -ne 0 || exit 1
          grep -Fq 'session.percent' "$EVIDENCE_DIR/before-regression.log" || exit 1
          grep -Fq 'session.resetText' "$EVIDENCE_DIR/before-regression.log" || exit 1

      - name: Check out the corrected tests while retaining build products
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fe11e9805ce4be18dabda449a91eef270b788658
          clean: false
          persist-credentials: false

      - name: Verify unchanged production code and restore matching inputs
        env:
          BUILD_CONTEXT: ${{ steps.build-context.outputs.context }}
        run: |
          set -euo pipefail
          git diff --exit-code 274b3ea9dc95136f2fbcbd071d05aa9d1311795c HEAD -- Sources
          echo 'Production sources are identical to native screenshots at274b3ea.' | tee "$EVIDENCE_DIR/production-equivalence.log"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/updated-source.txt"
          python3 Scripts/ci_swiftpm_cache.py restore --context "$BUILD_CONTEXT" --clean-fallback
          python3 Scripts/ci_swiftpm_cache.py snapshot --context "$BUILD_CONTEXT"

      - name: Run the complete repository check
        id: checks
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          make check 2>&1 | tee "$EVIDENCE_DIR/make-check.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$EVIDENCE_DIR/checks-exit-code.txt"
          exit "$result"

      - name: Save the check result before starting the expensive build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-quota-checks-fe11e98
          path: |
            ${{ env.EVIDENCE_DIR }}/environment.log
            ${{ env.EVIDENCE_DIR }}/make-check.log
            ${{ env.EVIDENCE_DIR }}/checks-exit-code.txt
            ${{ env.EVIDENCE_DIR }}/before-regression.log
            ${{ env.EVIDENCE_DIR }}/before-exit-code.txt
            ${{ env.EVIDENCE_DIR }}/production-equivalence.log
            ${{ env.EVIDENCE_DIR }}/updated-source.txt
          retention-days: 14

      - name: Build the test products with a separate cold-build deadline
        id: build
        if: steps.checks.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          source Scripts/test_environment.sh
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/build.log"
          import os, sys, tempfile
          sys.path.insert(0, "Scripts")
          from ci_swift_test_by_suite import run_command
          with tempfile.TemporaryDirectory(prefix="codexbar-proof-build-home-") as home:
              environment = os.environ | {"HOME": home, "CFFIXED_USER_HOME": home}
              result = run_command(["swift", "build", "--build-tests", "--jobs", "2"], timeout=3600, environment=environment)
          sys.exit(result)
          PY

      - name: Run focused regressions without rebuilding
        id: tests
        if: steps.build.outcome == 'success'
        env:
          CODEXBAR_TEST_NATIVE_TIMEOUT: 600
        continue-on-error: true
        run: |
          set -euo pipefail
          source Scripts/test_environment.sh
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/focused-tests.log"
          import os, pathlib, sys, tempfile
          sys.path.insert(0, "Scripts")
          from ci_swift_test_by_suite import run_command
          home = tempfile.mkdtemp(prefix="codex-quota-after-home-", dir=os.environ["RUNNER_TEMP"])
          environment = os.environ | {"HOME": home, "CFFIXED_USER_HOME": home}
          suites = "MenuCardCodexSessionQuotaTests|MenuCardModelCodexProjectionTests|CodexConsumerProjectionTests|MenuCardHeightFingerprintTests|MenuCardBindingQuotaTests|CodexWeeklyCapSurfaceTests"
          result = run_command(["swift", "test", "--no-parallel", "--skip-build", "--jobs", "2",
              "--filter", suites], timeout=600, environment=environment)
          pathlib.Path(os.environ["EVIDENCE_DIR"], "after-home.txt").write_text(home)
          pathlib.Path(os.environ["EVIDENCE_DIR"], "tests-exit-code.txt").write_text(str(result))
          sys.exit(result)
          PY

      - name: Preserve the successful build and regression checkpoint
        if: steps.tests.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: quota-${{ steps.build-context.outputs.prefix }}fe11e9805ce4be18dabda449a91eef270b788658

      - name: Upload before-and-after verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-review-follow-up-fe11e98
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Require baseline reproduction and updated regressions to pass
        if: always()
        env:
          CHECKS: ${{ steps.checks.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BASELINE: ${{ steps.before.outcome }}
        run: |
          printf 'checks=%s\nbuild=%s\ntests=%s\nbaseline=%s\n' "$CHECKS" "$BUILD" "$TESTS" "$BASELINE" | tee "$EVIDENCE_DIR/stage-results.txt"
          test "$CHECKS" = success
          test "$BUILD" = success
          test "$TESTS" = success
          test "$BASELINE" = success
